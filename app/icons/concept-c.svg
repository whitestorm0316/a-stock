<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A股超跌反转选股器">
  <title>概念 C · A 字反转</title>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152238"/>
      <stop offset="0.55" stop-color="#22406e"/>
      <stop offset="1" stop-color="#3266ad"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.22" cy="0.08" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#c-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#c-glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="114" fill="none"
        stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>

  <!-- 左腿：跌（绿） / 右腿：涨（红），合起来是一个 A -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 398 L256 162" stroke="#2ea06a" stroke-width="46"/>
    <path d="M256 162 L354 398" stroke="#e04a4a" stroke-width="46"/>
  </g>
  <!-- 横杠 = 筛选条件 -->
  <line x1="202" y1="296" x2="310" y2="296" stroke="#eaf0fb"
        stroke-width="36" stroke-linecap="round"/>
</svg>
